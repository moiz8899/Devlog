databases:
  # PostgreSQL Database
  - name: devlog-db
    plan: free
    region: oregon
    databaseName: devlog
    user: devlog

services:
  # Web Application with WebSocket
  - name: devlog-web
    type: web
    plan: free
    region: oregon
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devlog-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://devlog-web.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

# Note: For WebSocket support on Render, you need a paid plan (Starter or higher)
# Free tier has a 60-second timeout which will disconnect WebSocket connections
# If you need WebSocket, upgrade to at least the Starter plan ($7/month)

